<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Image Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Ollama Image Generator</h1>
            <p class="subtitle">Generate images using local Ollama models</p>
            <div id="status" class="status"></div>
        </header>

        <main>
            <div class="input-section">
                <div class="form-group">
                    <label for="prompt">Enter your prompt:</label>
                    <textarea 
                        id="prompt" 
                        placeholder="Describe the image you want to generate..."
                        rows="4"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="model">Select Model:</label>
                    <select id="model">
                        <option value="x/flux2-klein:4b">x/flux2-klein:4b (High Quality)</option>
                        <option value="x/z-image-turbo:fp8">x/z-image-turbo:fp8 (Fast)</option>
                    </select>
                </div>

                <button id="generateBtn" class="generate-btn">
                    <span class="btn-text">Generate Image</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </div>

            <div class="output-section">
                <div id="result" class="result-container">
                    <div class="placeholder">
                        <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="10" y="10" width="80" height="80" rx="8" stroke="currentColor" stroke-width="2"/>
                            <circle cx="35" cy="35" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="M10 70 L30 50 L50 70 L70 40 L90 60 L90 90 L10 90 Z" fill="currentColor" opacity="0.3"/>
                        </svg>
                        <p>Your generated image will appear here</p>
                    </div>
                </div>
            </div>

            <div id="history" class="history-section">
                <h3>Generation History</h3>
                <div id="historyList" class="history-list"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
