apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-image-generator
  labels:
    app: ollama-image-generator
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollama-image-generator
  template:
    metadata:
      labels:
        app: ollama-image-generator
        version: v1
    spec:
      containers:
      - name: ollama-image-generator
        image: ollama-image-generator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: OLLAMA_URL
          valueFrom:
            configMapKeyRef:
              name: ollama-image-generator-config
              key: ollama_url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      securityContext:
        fsGroup: 1001

